<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <title>Perfect Pitch Trainer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- Flash overlay for visual entrainment -->
    <div id="flash-overlay"></div>

    <!-- Main content area -->
    <div id="main-content">
      <!-- Start screen -->
      <div id="start-screen" class="screen active">
        <h1>Perfect Pitch</h1>
        <p class="subtitle">Train absolute pitch recognition</p>
        <div class="start-buttons">
          <button id="btn-pretest" class="btn-primary">Start Pre-Test</button>
          <button id="btn-training" class="btn-secondary">Continue Training</button>
        </div>
        <div id="current-level" class="hidden">
          <span>Level <span id="level-display">1</span></span>
        </div>
      </div>

      <!-- Pre-test screen -->
      <div id="pretest-screen" class="screen">
        <div id="pretest-progress">
          <span id="pretest-trial">1</span>/12
        </div>
        <div id="pretest-display"></div>
        <div id="pretest-instructions" class="instructions">
          Type the number (0-11) you hear
        </div>
      </div>

      <!-- Training screen -->
      <div id="training-screen" class="screen">
        <div id="phase-indicator"></div>
        <div id="training-display"></div>
        <div id="phase-instructions" class="instructions"></div>
      </div>

      <!-- Recognition test during training -->
      <div id="recognition-screen" class="screen">
        <div id="recognition-timer"></div>
        <div id="recognition-display"></div>
        <div id="feedback-indicator"></div>
      </div>

      <!-- Rest screen -->
      <div id="rest-screen" class="screen">
        <div id="rest-message">Close your eyes. Let it settle.</div>
        <div id="rest-timer"></div>
      </div>

      <!-- Results screen -->
      <div id="results-screen" class="screen">
        <h2>Block Complete</h2>
        <div id="floor-metrics">
          <div class="metric">
            <span class="metric-label">Worst Latency</span>
            <span id="metric-latency" class="metric-value">--</span>
          </div>
          <div class="metric">
            <span class="metric-label">Slowest Pitch</span>
            <span id="metric-worst-pitch" class="metric-value">--</span>
          </div>
          <div class="metric">
            <span class="metric-label">Floor Score</span>
            <span id="metric-floor" class="metric-value">--</span>
          </div>
          <div class="metric progress-indicator">
            <span id="metric-progress"></span>
          </div>
        </div>
        <button id="btn-next-block" class="btn-primary">Next Block</button>
      </div>

      <!-- Sing-back test screen -->
      <div id="singback-screen" class="screen">
        <div id="singback-target"></div>
        <div id="singback-feedback"></div>
        <div id="singback-deviation"></div>
        <button id="btn-start-singback" class="btn-secondary">Start Listening</button>
      </div>

      <!-- Level up screen -->
      <div id="levelup-screen" class="screen">
        <h2>Level Up!</h2>
        <div id="new-level"></div>
        <p id="level-description"></p>
        <button id="btn-continue-level" class="btn-primary">Continue</button>
      </div>
    </div>

    <!-- Number input pad (always available but hidden during passive phases) -->
    <div id="number-pad" class="hidden">
      <div class="pad-row">
        <button class="num-btn" data-num="0">0</button>
        <button class="num-btn" data-num="1">1</button>
        <button class="num-btn" data-num="2">2</button>
        <button class="num-btn" data-num="3">3</button>
      </div>
      <div class="pad-row">
        <button class="num-btn" data-num="4">4</button>
        <button class="num-btn" data-num="5">5</button>
        <button class="num-btn" data-num="6">6</button>
        <button class="num-btn" data-num="7">7</button>
      </div>
      <div class="pad-row">
        <button class="num-btn" data-num="8">8</button>
        <button class="num-btn" data-num="9">9</button>
        <button class="num-btn" data-num="10">10</button>
        <button class="num-btn" data-num="11">11</button>
      </div>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
